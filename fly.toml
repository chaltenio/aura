# Fly.io config. One-time: `fly launch --copy-config --no-deploy`, `fly volumes create haunt_data --size 1`, then `fly deploy`.
app = "haunt-aura"
primary_region = "sjc"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "haunt_data"
  destination = "/data"
