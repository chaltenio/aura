# Fly.io config. Deploy with scripts/deploy.sh (creates app + volume, stages secrets, deploys, smoke-checks).
# Change `app` if the name is taken on Fly; everything else reads it from here.
app = "aura-haunt"
primary_region = "sjc"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  # Frontends on other origins that may call this API and get sign-in handoffs (server/cors.js): the Base44 mirror.
  FRONTEND_ORIGINS = "https://aura-haunt.base44.app"
  # Monthly outbound-data cap (server/bandwidth.js): past it every request but /api/version gets 503 until the 1st (UTC).
  # 10 GB is about 1,250 first visits and costs at most $1.20 (Africa/India rate), $0.20 in North America.
  BANDWIDTH_CAP_GB = "10"

[http_service]
  internal_port = 3000
  force_https = true
  # Cost cap: the one machine stops ~5 minutes after the last connection closes and the next visit starts it again (that
  # visit waits about 4 s; an open page keeps it awake). An idle month costs cents; awake all month it is about $4.41 in sjc.
  # Machines are never added automatically, so with the bandwidth cap a month cannot pass about $6 (docs/DEPLOY.md).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "haunt_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
