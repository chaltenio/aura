<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAUNT · Admin</title><link rel="stylesheet" href="/app.css">
<style>
 .wrap{max-width:900px;margin:0 auto;padding:0 16px 40px}
 .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
 .row button,.u button{width:auto;margin:0;padding:8px 12px;font-size:14px}
 .u{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #2a2738}
 .u img,.u .ph{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#2a2738;flex:none}
 .u .grow{flex:1;min-width:0}.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#2a2738;margin-left:4px}
 .tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
 select,input[type=search]{padding:10px;border-radius:10px;border:1px solid #2a2738;background:#0f0e16;color:var(--ink);font-size:16px}
 .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.stats .big{font-size:28px;font-weight:700}
</style></head>
<body><div class="wrap">
<h1><span class="ghost">👻</span> HAUNT admin</h1>
<div class="panel" id="login"><label for="tok">Admin token</label><input type="text" id="tok" autocomplete="off" autocapitalize="off"><button id="go">Sign in</button><div class="status" id="err"></div></div>
<div id="app" hidden>
 <div class="panel stats" id="stats"></div>
 <h2>Events</h2>
 <div class="panel"><div class="row"><input type="text" id="ev-name" placeholder="Event name" style="flex:1"><button id="ev-add">Create</button></div><div id="events"></div></div>
 <h2>Message</h2>
 <div class="panel"><label for="msg">Text (max 500)</label><textarea id="msg" rows="2" maxlength="500"></textarea>
  <div class="row" style="margin-top:8px"><select id="to"></select><button id="send">Send</button><span class="mute" id="sent"></span></div></div>
 <h2>Attendees</h2>
 <div class="panel"><input type="search" id="q" placeholder="Filter by name, handle, provider" style="width:100%"><div id="users"></div></div>
 <h2>Recent messages</h2><div class="panel" id="log"></div>
</div></div>
<script type="module" src="/admin.js"></script>
</body></html>
