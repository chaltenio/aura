<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAUNT</title><link rel="stylesheet" href="/app.css"></head>
<body>
<h1><span class="ghost">👻</span> HAUNT</h1>
<p>Point your phone at someone in the room and know who they are. Opt-in only. Faces never leave your phone.</p>
<div class="panel">
  <a href="/register"><button>Register (be findable)</button></a>
  <a href="/hunt"><button class="secondary">Hunt</button></a>
  <a href="/me"><button class="secondary">My card</button></a>
  <a href="/screen" class="hint">Big screen view</a>
</div>
<div class="panel qr" id="qr"></div>
<p class="hint">Scan the QR with another phone to join.</p>
<footer class="hint" id="version" style="text-align:center;margin-top:32px"></footer>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>const q = qrcode(0, 'M'); q.addData(location.origin + '/register'); q.make(); document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 6, margin: 2 });</script>
<script>// deploy number: one more on every deploy (server/version.js)
fetch((window.HAUNT_API || '') + '/api/version', { cache: 'no-store' }).then((r) => r.json()).then((v) => {
  const when = v.deployedAt ? new Date(v.deployedAt).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
  document.getElementById('version').textContent = (v.deploy ? `v${v.deploy} · ${v.version}${when ? ` · deployed ${when}` : ''}` : 'dev build') + (window.HAUNT_MIRROR ? ` · ${window.HAUNT_MIRROR}` : '');
}).catch(() => {});</script>
</body></html>
