<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a10"><link rel="icon" href="/favicon.svg">
<title>HAUNT · Hunt</title><link rel="stylesheet" href="/app.css"></head>
<body>
<header class="top"><a class="brand" href="/">👻 HAUNT</a><button class="presence" id="presence" hidden></button><a class="top-link" id="melink" href="/me">My card</a></header>
<div class="video-wrap" id="wrap">
  <video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas>
  <div class="hud"><span class="pill" id="hud-state"></span></div>
  <div class="cam-hint" id="hint"></div>
  <div class="cam-idle" id="idle">
    <div class="cam-ghost">👻</div>
    <p id="idle-text">Point your camera at someone in the room to see who they are.</p>
    <div class="mute" id="idle-sub">Loading face model…</div>
    <button id="start" disabled>Start hunting</button>
  </div>
</div>
<div class="status debug" id="status">Loading face model…</div>
<input id="snapfile" type="file" accept="image/*" hidden><!-- snap mode (Apple Vision Pro): kept outside #wrap so its click never reaches the photo's tap handler -->
<details class="dev"><summary class="hint">Test with a photo</summary><input id="testfile" type="file" accept="image/*"></details>
<div class="sheet" id="sheet" role="dialog" aria-labelledby="c-name">
  <button class="grab" id="grab" aria-label="Close"></button>
  <div class="card"><img id="c-avatar" alt="" hidden><div class="noavatar" id="c-noavatar">👤</div><div><div class="name" id="c-name"></div><div class="handle" id="c-handle"></div><div class="blurb" id="c-blurb"></div><div class="match" id="c-sim"></div><div class="live" id="c-live" hidden></div></div></div>
  <div id="c-profile"></div>
  <button id="haunt">👻 Haunt them</button>
  <button class="secondary" id="dismiss">Close</button>
</div>
<script type="module" src="/hunt.js"></script>
</body></html>
