<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAUNT · My card</title><link rel="stylesheet" href="/app.css"></head>
<body>
<h1><span class="ghost">👻</span> My card</h1>
<div class="panel" id="nocard" hidden><p>You're not registered on this phone.</p><a href="/register"><button>Register</button></a></div>
<div id="has" hidden>
  <div class="panel card"><img id="avatar" hidden><div class="noavatar" id="noavatar">👤</div><div><div class="name" id="name"></div><div class="handle" id="handle"></div><div class="blurb" id="blurb"></div><div class="sim" id="stats"></div></div></div>
  <div class="panel"><div id="profile"></div><details><summary class="hint">Edit handle / LinkedIn</summary><label for="ghhandle">GitHub handle</label><input id="ghhandle" type="text" autocapitalize="none"><label for="linkedin">LinkedIn URL</label><input id="linkedin" type="text" autocapitalize="none" placeholder="https://www.linkedin.com/in/you"><button class="secondary" id="save">Save</button></details></div>
  <div class="panel">
    <button id="arm">🔊 Sound on (tap anywhere once to wake it)</button>
    <a href="/hunt"><button class="secondary">Go hunt</button></a>
    <div class="check"><input id="consent" type="checkbox"><label for="consent" style="margin:0">Findable (uncheck to vanish from every phone immediately)</label></div>
    <button class="danger" id="forget">Forget me on this phone</button>
  </div>
  <h2>Tonight's connections <span id="nconn"></span></h2>
  <div class="conn-actions" id="connact" hidden><button class="secondary" id="copy">Copy as text</button><button class="secondary" id="share" hidden>Share</button></div>
  <ul class="conns" id="conns"></ul>
</div>
<p class="hint"><a href="/">Home</a></p>
<script type="module" src="/me.js"></script>
</body></html>
